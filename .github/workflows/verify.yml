name: Reproduce proofs and build papers
on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all numbered problem folders
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for folder in problems/PHY-*; do
            [ -d "$folder" ] || continue
            test -f "$folder/requirements.txt"
            test -f "$folder/verify.py"
            test -f "$folder/AUDIT.md"
            test -f "$folder/paper.tex"
            echo "REPRODUCING $folder"
            python -m pip install -r "$folder/requirements.txt"
            python "$folder/verify.py"
            if [ -f "$folder/verify_independent.py" ]; then
              python "$folder/verify_independent.py"
            fi
            if [ -f "$folder/verify_material.py" ]; then
              python "$folder/verify_material.py"
            fi
            if [ -f "$folder/verify_material_independent.py" ]; then
              python "$folder/verify_material_independent.py"
            fi
            if [ -f "$folder/verify_su2_coefficients.py" ]; then
              python "$folder/verify_su2_coefficients.py"
            fi
            if [ -f "$folder/verify_su2_allorders_kp.py" ]; then
              python "$folder/verify_su2_allorders_kp.py"
            fi
            if [ -f "$folder/verify_su2_allorders_independent.py" ]; then
              python "$folder/verify_su2_allorders_independent.py"
            fi
            if [ -f "$folder/verify_su2_gluing_s3.cpp" ]; then
              g++ -std=c++17 -O2 -Wall -Wextra "$folder/verify_su2_gluing_s3.cpp" -o /tmp/phy_su2_s3
              /tmp/phy_su2_s3
            fi
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "Verified $count problem folders"
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build all source manuscripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for folder in problems/PHY-*; do
            [ -f "$folder/paper.tex" ] || continue
            (cd "$folder" && pdflatex -interaction=nonstopmode -halt-on-error paper.tex && pdflatex -interaction=nonstopmode -halt-on-error paper.tex)
            test -f "$folder/PDF_FILENAME.txt"
            pdf_name="$(cat "$folder/PDF_FILENAME.txt")"
            [[ "$pdf_name" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "Invalid PDF filename: $pdf_name"; exit 1; }
            cp "$folder/paper.pdf" "build/${pdf_name}.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PHYSICS2026-PDF-manuscripts
          path: build/*.pdf
