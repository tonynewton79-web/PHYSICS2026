name: Reproduce proofs and build papers
on:
  push:
    branches: [main]
  pull_request:
jobs:
  phy-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact symbolic dependencies
        run: python -m pip install -r problems/PHY-001-EMHD-Poisson-Lax/requirements.txt
      - name: Verify PHY-001 exact identities
        run: python problems/PHY-001-EMHD-Poisson-Lax/verify.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build PHY-001 paper
        working-directory: problems/PHY-001-EMHD-Poisson-Lax
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
      - uses: actions/upload-artifact@v4
        with:
          name: PHY-001-manuscript-PDF
          path: problems/PHY-001-EMHD-Poisson-Lax/paper.pdf
